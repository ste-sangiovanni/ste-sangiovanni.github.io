<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Vector Space</title>
  <style>
    :root {
      --accent: #136769;
      --accent-soft: #e9f4f4;
      --accent-deep: #0f5354;
      --text: #161a1d;
      --muted: #5f6b73;
      --line: #c7d9d9;
      --paper: #ffffff;
      --bg: #f7fbfb;
      --x: #136769;
      --y: #8c6d46;
      --z: #5b7088;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(19, 103, 105, 0.08), transparent 28%),
        linear-gradient(180deg, #fbfefe 0%, var(--bg) 100%);
    }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 24px 36px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.8rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--paper);
      border: 1px solid rgba(19, 103, 105, 0.18);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(19, 103, 105, 0.06);
    }

    .panel,
    .viewer {
      padding: 18px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 1.06rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="number"],
    input[type="color"],
    input[type="range"] {
      width: 100%;
    }

    input[type="text"],
    input[type="number"] {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.96rem;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(19, 103, 105, 0.12);
    }

    input[type="color"] {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 4px;
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    .range-row {
      display: grid;
      grid-template-columns: 24px 1fr 64px;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .axis-tag {
      font-weight: 700;
      text-align: center;
    }

    .axis-tag.x { color: var(--x); }
    .axis-tag.y { color: var(--y); }
    .axis-tag.z { color: var(--z); }

    .range-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
      text-align: right;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      border: 1px solid rgba(19, 103, 105, 0.18);
      background: var(--accent-soft);
      color: var(--accent-deep);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 0.92rem;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      background: #fff4f4;
      border-color: #e7c9c9;
      color: #8b3f3f;
    }

    button:hover {
      filter: brightness(0.98);
    }

    .divider {
      height: 1px;
      background: rgba(19, 103, 105, 0.12);
      margin: 18px 0;
    }

    .vector-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .vector-item {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(19, 103, 105, 0.1);
      background: var(--bg);
      cursor: pointer;
    }

    .vector-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .vector-name {
      font-weight: 700;
    }

    .vector-coords {
      color: var(--muted);
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }

    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    .viewer-note {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .plot-wrap {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(180deg, #ffffff 0%, #fbfefe 100%);
      border: 1px solid rgba(19, 103, 105, 0.14);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend i {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }

    .axes {
      display: flex;
      gap: 12px;
    }

    .axes b {
      font-size: 0.84rem;
    }

    @media (max-width: 940px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .header {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="eyebrow">Local tool</div>
        <h1>3D vector space editor</h1>
        <p class="subtitle">Create vectors, assign coordinates, rotate the view, and move points in 3D.</p>
      </div>
      <div class="axes">
        <b style="color: var(--x);">X</b>
        <b style="color: var(--y);">Y</b>
        <b style="color: var(--z);">Z</b>
      </div>
    </header>

    <section class="layout">
      <aside class="card panel">
        <h2 class="section-title">Vector editor</h2>

        <div class="form-grid">
          <div class="field full">
            <label for="vector-label">Label</label>
            <input id="vector-label" type="text" placeholder="e.g. democrazia">
          </div>

          <div class="field">
            <label for="vector-x">X</label>
            <input id="vector-x" type="number" step="0.1">
          </div>

          <div class="field">
            <label for="vector-y">Y</label>
            <input id="vector-y" type="number" step="0.1">
          </div>

          <div class="field">
            <label for="vector-z">Z</label>
            <input id="vector-z" type="number" step="0.1">
          </div>

          <div class="field">
            <label for="vector-color">Color</label>
            <input id="vector-color" type="color" value="#136769">
          </div>
        </div>

        <div class="range-row">
          <div class="axis-tag x">X</div>
          <input id="slider-x" type="range" min="-10" max="10" step="0.1">
          <div class="range-value" id="slider-x-value">0.0</div>
        </div>

        <div class="range-row">
          <div class="axis-tag y">Y</div>
          <input id="slider-y" type="range" min="-10" max="10" step="0.1">
          <div class="range-value" id="slider-y-value">0.0</div>
        </div>

        <div class="range-row">
          <div class="axis-tag z">Z</div>
          <input id="slider-z" type="range" min="-10" max="10" step="0.1">
          <div class="range-value" id="slider-z-value">0.0</div>
        </div>

        <div class="button-row">
          <button id="add-vector" class="primary" type="button">Add vector</button>
          <button id="update-vector" type="button">Update selected</button>
          <button id="duplicate-vector" type="button">Duplicate</button>
          <button id="delete-vector" class="danger" type="button">Delete</button>
          <button id="new-vector" type="button">New empty</button>
        </div>

        <div class="divider"></div>

        <h2 class="section-title">Vectors</h2>
        <div class="vector-list" id="vector-list"></div>
      </aside>

      <section class="card viewer">
        <div class="viewer-top">
          <h2 class="section-title">3D space</h2>
          <p class="viewer-note">Drag to rotate. Click a point to select it.</p>
        </div>

        <div class="toolbar">
          <button id="reset-view" type="button">Reset view</button>
          <button id="front-view" type="button">Front</button>
          <button id="top-view" type="button">Top</button>
          <button id="side-view" type="button">Side</button>
          <button id="toggle-labels" type="button">Hide labels</button>
        </div>

        <div class="plot-wrap">
          <canvas id="space-canvas" width="960" height="600"></canvas>
        </div>

        <div class="legend">
          <span><i style="background: var(--x);"></i>X axis</span>
          <span><i style="background: var(--y);"></i>Y axis</span>
          <span><i style="background: var(--z);"></i>Z axis</span>
        </div>
      </section>
    </section>
  </main>

  <script>
    const vectors = [
      { id: 1, label: "democrazia", x: -3.0, y: 2.2, z: 1.4, color: "#136769" },
      { id: 2, label: "partito", x: -1.1, y: 0.9, z: 0.6, color: "#2e7b7c" },
      { id: 3, label: "cane", x: 1.8, y: -1.4, z: -0.8, color: "#8c6d46" },
      { id: 4, label: "Roma", x: 3.2, y: -1.1, z: 1.1, color: "#5b7088" }
    ];

    let selectedId = 1;
    let nextId = 5;
    let showLabels = true;

    const view = {
      yaw: -0.6,
      pitch: 0.45,
      scale: 42
    };

    const canvas = document.getElementById("space-canvas");
    const ctx = canvas.getContext("2d");
    const vectorList = document.getElementById("vector-list");

    const labelInput = document.getElementById("vector-label");
    const xInput = document.getElementById("vector-x");
    const yInput = document.getElementById("vector-y");
    const zInput = document.getElementById("vector-z");
    const colorInput = document.getElementById("vector-color");

    const sliderX = document.getElementById("slider-x");
    const sliderY = document.getElementById("slider-y");
    const sliderZ = document.getElementById("slider-z");
    const sliderXValue = document.getElementById("slider-x-value");
    const sliderYValue = document.getElementById("slider-y-value");
    const sliderZValue = document.getElementById("slider-z-value");

    const addButton = document.getElementById("add-vector");
    const updateButton = document.getElementById("update-vector");
    const duplicateButton = document.getElementById("duplicate-vector");
    const deleteButton = document.getElementById("delete-vector");
    const newButton = document.getElementById("new-vector");
    const resetViewButton = document.getElementById("reset-view");
    const frontViewButton = document.getElementById("front-view");
    const topViewButton = document.getElementById("top-view");
    const sideViewButton = document.getElementById("side-view");
    const toggleLabelsButton = document.getElementById("toggle-labels");

    const drag = {
      active: false,
      startX: 0,
      startY: 0,
      yaw: 0,
      pitch: 0
    };

    function selectedVector() {
      return vectors.find((vector) => vector.id === selectedId);
    }

    function syncFormFromSelection() {
      const vector = selectedVector();
      if (!vector) {
        return;
      }
      labelInput.value = vector.label;
      xInput.value = vector.x;
      yInput.value = vector.y;
      zInput.value = vector.z;
      colorInput.value = vector.color;
      sliderX.value = vector.x;
      sliderY.value = vector.y;
      sliderZ.value = vector.z;
      sliderXValue.textContent = Number(vector.x).toFixed(1);
      sliderYValue.textContent = Number(vector.y).toFixed(1);
      sliderZValue.textContent = Number(vector.z).toFixed(1);
    }

    function syncSelectionFromForm() {
      const vector = selectedVector();
      if (!vector) {
        return;
      }
      vector.label = labelInput.value.trim() || `vector-${vector.id}`;
      vector.x = Number(xInput.value) || 0;
      vector.y = Number(yInput.value) || 0;
      vector.z = Number(zInput.value) || 0;
      vector.color = colorInput.value;
      sliderX.value = vector.x;
      sliderY.value = vector.y;
      sliderZ.value = vector.z;
      sliderXValue.textContent = vector.x.toFixed(1);
      sliderYValue.textContent = vector.y.toFixed(1);
      sliderZValue.textContent = vector.z.toFixed(1);
    }

    function project(point) {
      const cosY = Math.cos(view.yaw);
      const sinY = Math.sin(view.yaw);
      const cosP = Math.cos(view.pitch);
      const sinP = Math.sin(view.pitch);

      const x1 = point.x * cosY - point.z * sinY;
      const z1 = point.x * sinY + point.z * cosY;
      const y2 = point.y * cosP - z1 * sinP;
      const z2 = point.y * sinP + z1 * cosP;

      const perspective = 620 / (620 + z2 * 22);
      return {
        x: canvas.width / 2 + x1 * view.scale * perspective,
        y: canvas.height / 2 - y2 * view.scale * perspective,
        depth: z2,
        perspective
      };
    }

    function drawAxis(color, end, label) {
      const origin = project({ x: 0, y: 0, z: 0 });
      const target = project(end);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(target.x, target.y);
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = "700 13px Helvetica Neue, Arial, sans-serif";
      ctx.fillText(label, target.x + 8, target.y - 8);
    }

    function renderVectorList() {
      vectorList.innerHTML = "";
      vectors.forEach((vector) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = `vector-item${vector.id === selectedId ? " active" : ""}`;
        item.innerHTML = `
          <span class="swatch" style="background:${vector.color}"></span>
          <span>
            <span class="vector-name">${vector.label}</span><br>
            <span class="vector-coords">(${vector.x.toFixed(1)}, ${vector.y.toFixed(1)}, ${vector.z.toFixed(1)})</span>
          </span>
          <span class="vector-coords">id ${vector.id}</span>
        `;
        item.addEventListener("click", () => {
          selectedId = vector.id;
          syncFormFromSelection();
          render();
        });
        vectorList.appendChild(item);
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fbfefe";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawAxis(getComputedStyle(document.documentElement).getPropertyValue("--x").trim(), { x: 6, y: 0, z: 0 }, "X");
      drawAxis(getComputedStyle(document.documentElement).getPropertyValue("--y").trim(), { x: 0, y: 6, z: 0 }, "Y");
      drawAxis(getComputedStyle(document.documentElement).getPropertyValue("--z").trim(), { x: 0, y: 0, z: 6 }, "Z");

      const origin = project({ x: 0, y: 0, z: 0 });
      const projected = vectors.map((vector) => ({
        vector,
        point: project(vector)
      })).sort((a, b) => a.point.depth - b.point.depth);

      projected.forEach(({ vector, point }) => {
        ctx.strokeStyle = vector.color;
        ctx.lineWidth = vector.id === selectedId ? 2.6 : 1.8;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();

        ctx.fillStyle = vector.color;
        ctx.beginPath();
        ctx.arc(point.x, point.y, vector.id === selectedId ? 8 : 6, 0, Math.PI * 2);
        ctx.fill();

        if (vector.id === selectedId) {
          ctx.strokeStyle = "#161a1d";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        if (showLabels) {
          ctx.fillStyle = vector.id === selectedId ? "#136769" : "#161a1d";
          ctx.font = vector.id === selectedId
            ? "700 14px Helvetica Neue, Arial, sans-serif"
            : "500 13px Helvetica Neue, Arial, sans-serif";
          ctx.fillText(vector.label, point.x + 10, point.y - 10);
        }
      });

      renderVectorList();
    }

    function addVector() {
      const vector = {
        id: nextId++,
        label: labelInput.value.trim() || `vector-${nextId - 1}`,
        x: Number(xInput.value) || 0,
        y: Number(yInput.value) || 0,
        z: Number(zInput.value) || 0,
        color: colorInput.value
      };
      vectors.push(vector);
      selectedId = vector.id;
      syncFormFromSelection();
      render();
    }

    function updateVector() {
      syncSelectionFromForm();
      render();
    }

    function duplicateVector() {
      const vector = selectedVector();
      if (!vector) {
        return;
      }
      const copy = {
        ...vector,
        id: nextId++,
        label: `${vector.label}-copy`,
        x: vector.x + 0.8,
        y: vector.y + 0.8,
        z: vector.z + 0.8
      };
      vectors.push(copy);
      selectedId = copy.id;
      syncFormFromSelection();
      render();
    }

    function deleteVector() {
      if (vectors.length === 1) {
        return;
      }
      const index = vectors.findIndex((vector) => vector.id === selectedId);
      if (index === -1) {
        return;
      }
      vectors.splice(index, 1);
      selectedId = vectors[Math.max(0, index - 1)].id;
      syncFormFromSelection();
      render();
    }

    function newEmptyVector() {
      labelInput.value = "";
      xInput.value = 0;
      yInput.value = 0;
      zInput.value = 0;
      colorInput.value = "#136769";
      sliderX.value = 0;
      sliderY.value = 0;
      sliderZ.value = 0;
      sliderXValue.textContent = "0.0";
      sliderYValue.textContent = "0.0";
      sliderZValue.textContent = "0.0";
    }

    function nudgeFromSliders() {
      xInput.value = sliderX.value;
      yInput.value = sliderY.value;
      zInput.value = sliderZ.value;
      sliderXValue.textContent = Number(sliderX.value).toFixed(1);
      sliderYValue.textContent = Number(sliderY.value).toFixed(1);
      sliderZValue.textContent = Number(sliderZ.value).toFixed(1);
      syncSelectionFromForm();
      render();
    }

    function pickVector(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      let best = null;
      let bestDistance = Infinity;
      vectors.forEach((vector) => {
        const point = project(vector);
        const d = Math.hypot(point.x - x, point.y - y);
        if (d < bestDistance) {
          bestDistance = d;
          best = vector;
        }
      });

      if (best && bestDistance < 18) {
        selectedId = best.id;
        syncFormFromSelection();
        render();
      }
    }

    addButton.addEventListener("click", addVector);
    updateButton.addEventListener("click", updateVector);
    duplicateButton.addEventListener("click", duplicateVector);
    deleteButton.addEventListener("click", deleteVector);
    newButton.addEventListener("click", newEmptyVector);

    [labelInput, xInput, yInput, zInput, colorInput].forEach((input) => {
      input.addEventListener("change", updateVector);
    });

    [sliderX, sliderY, sliderZ].forEach((slider) => {
      slider.addEventListener("input", nudgeFromSliders);
    });

    resetViewButton.addEventListener("click", () => {
      view.yaw = -0.6;
      view.pitch = 0.45;
      render();
    });

    frontViewButton.addEventListener("click", () => {
      view.yaw = 0;
      view.pitch = 0;
      render();
    });

    topViewButton.addEventListener("click", () => {
      view.yaw = 0;
      view.pitch = Math.PI / 2.3;
      render();
    });

    sideViewButton.addEventListener("click", () => {
      view.yaw = Math.PI / 2;
      view.pitch = 0;
      render();
    });

    toggleLabelsButton.addEventListener("click", () => {
      showLabels = !showLabels;
      toggleLabelsButton.textContent = showLabels ? "Hide labels" : "Show labels";
      render();
    });

    canvas.addEventListener("mousedown", (event) => {
      drag.active = true;
      drag.startX = event.clientX;
      drag.startY = event.clientY;
      drag.yaw = view.yaw;
      drag.pitch = view.pitch;
      canvas.classList.add("dragging");
    });

    window.addEventListener("mouseup", (event) => {
      if (drag.active) {
        const moved = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
        if (moved < 6) {
          pickVector(event.clientX, event.clientY);
        }
      }
      drag.active = false;
      canvas.classList.remove("dragging");
    });

    window.addEventListener("mousemove", (event) => {
      if (!drag.active) {
        return;
      }
      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      view.yaw = drag.yaw + dx * 0.01;
      view.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + dy * 0.01));
      render();
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      view.scale = Math.max(18, Math.min(110, view.scale - event.deltaY * 0.02));
      render();
    }, { passive: false });

    syncFormFromSelection();
    render();
  </script>
</body>
</html>
