    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Stefano Sangiovanni
          subtitle: "I am a PhD Candidate at the University of Milan. "
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          buttons:
          - name: Presentations
            url: presentations/
          - name: Papers
            url: papers/
          - name: Teaching
            url: teaching/
    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:stefano.sangiovanni@unimi.it
        #- name: Zoom
