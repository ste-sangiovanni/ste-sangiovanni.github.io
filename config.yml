baseURL: "https://ste-sangiovanni.github.io" 
title: Stefano Sangiovanni
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
  main:
    - name: Presentations
      url: presentations/
      weight: 2
    - name: Papers
      url: papers/
      weight: 3
    - name: Teaching
      url: teaching/
      weight: 4


params:
    description: "I am a PhD Candidate at the University of Milan. "
    author: Stefano Sangiovanni
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
