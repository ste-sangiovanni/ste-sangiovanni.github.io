      title: Stefano Sangiovanni
      subtitle: |
        <p class="profile-greeting">Hello, this is Stefano! 🌊</p>

        <p>I am a <b>computational political scientist</b> studying how political parties compete, communicate, and are evaluated by voters. My research focuses on <b>party competition</b> and <b>electoral behaviour</b>, with a particular interest in <b>valence politics</b>: how parties build and contest reputations for competence, integrity, and performance, and how these reputations shape voter behaviour and political accountability.</p>

        <p>I’m currently completing my PhD in Political Science at <a class="profile-link" href="https://www.nasp.eu/"><b>NASP, University of Milan</b></a> under the supervision of Prof. <a class="profile-link" href="https://andreaceron.com/"><b>Andrea Ceron</b></a> and Prof. <a class="profile-link" href="https://www.giovannainvernizzi.com/"><b>Giovanna Invernizzi</b></a>. During my PhD, I have also been a visiting researcher at the Mannheim Centre for European Social Research (MZES) and at Trinity College Dublin.</p>

        <p>From October 2026, I will join the <a class="profile-link" href="https://www.uni-konstanz.de/en/"><b>University of Konstanz</b></a> as a Postdoctoral Researcher in the <a class="profile-link" href="https://www.exc.uni-konstanz.de/en/inequality/"><b>Cluster of Excellence “The Politics of Inequality”</b></a>. As part of the <a class="profile-link" href="https://www.exc.uni-konstanz.de/en/inequality/research/projects/inequality-and-support-for-long-term-investment-policies/"><b>IneqInvest project</b></a>, I will use computational methods to study parties’ positions on long-term investment policies and their implications for political representation and socioeconomic inequalities.</p>

        <p>My work combines <b>quantitative</b>, <b>experimental</b>, and <b>computational methods</b>, including survey experiments, text-as-data, and large language models.</p>

        <p>Don’t hesitate to reach out if you’d like to chat about research, nerdy stuff, music, or sports!</p>
